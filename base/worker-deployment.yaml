apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          #image: huy951/worker-app
          image: 248195880649.dkr.ecr.ap-southeast-1.amazonaws.com/worker
          imagePullPolicy: Always
          env:
            - name: REDIS_HOST
              value: redis
            - name: DB_HOST
              value: db
