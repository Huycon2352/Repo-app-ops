# Cấu hình Policy Reporter đi kèm để gom lỗi chính sách
policyReporter:
  enabled: true
  
  # Cấu hình gửi thông báo ra các kênh bên ngoài
  config:
    channels:
      - name: discord-alerts
        type: discord
        # Dán link Webhook Discord của bạn vào đây
        webhook: "https://discord.com/api/webhooks/xxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
        # Bắn thông báo khi có chính sách ở trạng thái Cảnh báo (warn) hoặc Thất bại (fail)
        minimumPriority: "warning"
        # Định dạng thông báo gửi đi (để trống hoặc "v2")
        format: "v2"
