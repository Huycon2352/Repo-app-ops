apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-custom-rules
  namespace: falco

data:
  custom_rules.yaml: |
    - rule: Unauthorized Shell in Container
      desc: Detect shell spawned inside container
      condition: >
        spawned_process
        and container
        and shell_procs
      output: >
        Shell detected
        user=%user.name
        command=%proc.cmdline
        pod=%k8s.pod.name
        namespace=%k8s.ns.name
      priority: CRITICAL
