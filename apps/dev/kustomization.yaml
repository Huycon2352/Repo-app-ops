apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
patches:
  #Patch for Service
  - path: patch-vote-nodeport.yaml
    target:
      kind: Service
      name: vote
  - path: patch-result-nodeport.yaml
    target:
      kind: Service
      name: result
  #Patch for PersistentVolumeClaim ( env -dev )
  - path: patch-storage.yaml
  #Patch secret for Deployment pull image
  - path: patch-imagepullsecret.yaml
    target:
      kind: Deployment
  #Patch for Deployment rollout strategy
  - path: patch-rollout-worker.yaml
    target:
      kind: Deployment
      name: worker

  - path: patch-rollout-vote.yaml
    target:
      kind: Deployment
      name: vote

  - path: patch-rollout-result.yaml
    target:
      kind: Deployment
      name: result

images:
  - name: 248195880649.dkr.ecr.ap-southeast-1.amazonaws.com/result
    newName: 248195880649.dkr.ecr.ap-southeast-1.amazonaws.com/result
    newTag: fcb4897316b524d420de45afa294b27f5ef5f237
  - name: 248195880649.dkr.ecr.ap-southeast-1.amazonaws.com/vote
    newName: 248195880649.dkr.ecr.ap-southeast-1.amazonaws.com/vote
    newTag: e5bd48f3d1780ef1553419d83ca496dbc7077315
  - name: 248195880649.dkr.ecr.ap-southeast-1.amazonaws.com/worker
    newName: 248195880649.dkr.ecr.ap-southeast-1.amazonaws.com/worker
    newTag: 9eaf7a1b4ea494c32dfb467f90aab6379fdb7f79
