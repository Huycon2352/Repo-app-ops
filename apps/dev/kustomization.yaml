  - name: huy951/vote-app
    newName: huy951/vote-app
    newTag: 03ccbdbb8d05f216298bcc2a60b1836b0838ea2c
  - name: huy951/worker-app
    newName: huy951/worker-app
    newTag: 03ccbdbb8d05f216298bcc2a60b1836b0838ea2c
