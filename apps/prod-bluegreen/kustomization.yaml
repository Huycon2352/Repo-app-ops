apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base/storageclass
  - ../../base/db
  - ../../base/redis
  - ../../base/result
  - ../../base/worker

  - blue-green/deployment-blue-vote.yaml
