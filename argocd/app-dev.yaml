apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Huycon2352/Repo-app-ops
    targetRevision: main
    path: apps/dev

  destination:
    server: https://kubernetes.default.svc
    #server: https://172.20.0.2:6443
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
